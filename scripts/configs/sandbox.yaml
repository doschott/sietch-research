# Sandbox session template for the registered scenario (replan).
# real_game_connection must stay false. This file cannot enable a game client.
mode: sandbox
real_game_connection: false
policy: scripted
policy_style: replan
seed: 7
max_steps: 16
session_id: null
world:
  water: 4
  base_integrity: 3
  storm_period: 6
  storm_length: 2
  max_water: 8
  max_base: 10
agents:
  eve:
    role: planner
    policy: scripted
  edos:
    role: recovery
    policy: scripted
supervisor:
  # The command line must also pass --operator-present.
  human_present: true
  approval_required:
    - abandon_shelter
    - discard_water
logging:
  path: sessions/sandbox.jsonl
  reject_personal_data: true
